<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wanderlust Travel Guide</title>
    <meta name="description" content="Contact Wanderlust Travel Guide to start planning your dream vacation.">
    <meta name="author" content="Josue">

    <meta property="og:title" content="Contact Us | Wanderlust Travel Guide">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://josuequinones19.github.io/wdd231/finalproject/images/contact-bg.jpg">
    <meta property="og:url" content="https://josuequinones19.github.io/wdd231/finalproject/contact.html">
    <meta property="og:description" content="Contact Wanderlust Travel Guide to start planning your dream vacation.">

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <script type="module" src="scripts/main.js"></script>

    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg-white);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .submit-btn:hover {
            background: #083a50;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.jpg" alt="Wanderlust Travel Logo" width="50" height="50">
            <span>Wanderlust Guide</span>
        </div>
        <button id="menu-button" aria-label="Toggle Menu">☰</button>
    </header>

    <nav>
        <ul id="nav-list" class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
    </nav>

    <main>
        <h1>Let's Plan Your Trip</h1>

        <form class="contact-form" action="form-action.html" method="GET">
            <div class="form-group">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="interest">Destination of Interest:</label>
                <select id="interest" name="interest">
                    <option value="europe">Europe</option>
                    <option value="asia">Asia</option>
                    <option value="americas">The Americas</option>
                    <option value="islands">Tropical Islands</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Special Requests:</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Inquiry</button>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Wanderlust Travel Guide | Josue</p>
        <p id="lastModified"></p>
        <div class="footer-links">
            <a href="attributions.html">Attributions</a> |
            <a href="https://youtube.com" target="_blank">Project Video Demonstration</a>
        </div>
    </footer>
</body>

</html>
